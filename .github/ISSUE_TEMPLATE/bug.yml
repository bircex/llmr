name: Something is wrong
description: A call that fails, a number that looks wrong, a reply that lost something.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Two things make a report here quick to act on: which **reach** you were using, and
        what you expected instead. The second matters more than it sounds — several of this
        project's decisions look like bugs until you know the reason, and `docs/DESIGN.md`
        says which.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >
        The request you sent (or the call you made), what came back, and the x-llmr-route and
        x-llmr-fell-through headers if it went through the gateway. Leave out prompts and keys.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: >
        If it is about usage or cost, say what number you expected and where from. Absent is
        not zero here, on purpose.
    validations:
      required: true

  - type: dropdown
    id: reach
    attributes:
      label: Which reach
      description: Where the model was running. It decides what a provider can carry.
      options:
        - first-party-api
        - cloud-partner
        - private-endpoint
        - local-cli
        - self-hosted
        - not sure
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Which provider and model
      placeholder: "anthropic/claude-sonnet-5, or the [[provider]] block from llmr.toml without keys"

  - type: input
    id: running
    attributes:
      label: How you run it
      placeholder: "ghcr.io/bircex/llmr:0.3.0, a release binary, or built from source"

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "llmr --version, an image tag, or a commit"
