name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For the job that looks ahead of the pinned toolchain. Monday morning, so a bump waiting
  # to be done is found on a weekday rather than in somebody's pull request.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain named here. `rust-toolchain.toml` is the one place that says which
      # compiler this crate is checked against, and rustup installs it on the first cargo
      # call. Naming a version here as well is how the two drift apart.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Every feature combination, because a lint that only fires under one of them is a
      # lint that fires for the first person to enable it.
      - name: Clippy, default features
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, no features
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --all-features --all-targets -- -D warnings

      # Docs are part of the deliverable. A broken intra doc link ships to docs.rs and
      # stays there until the next release.
      - name: Documentation, all features
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # And again with the default set, because a link to a feature gated item resolves
      # under `--all-features` and nowhere else. That is the only build where it is
      # invisible, and it is the build this job used to be.
      - name: Documentation, default features
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: each provider alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # A caller who wants only the local command line provider should not be building an
      # HTTP client and a TLS stack. These builds are the check that the features actually
      # separate, which a single all-features build cannot see.
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features cli
      - run: cargo build --no-default-features --features anthropic
      - run: cargo build --no-default-features --features openai
      - run: cargo build --no-default-features --features testkit
      - run: cargo build --no-default-features --features retry
      - run: cargo build --no-default-features --features tracing

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stated in Cargo.toml. Untested, it is a claim rather than a promise.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      # `+1.90.0` rather than a bare cargo, because `rust-toolchain.toml` outranks the
      # toolchain the step above installed. Without it this job would build with the pinned
      # compiler and report the minimum version as tested when nothing had tested it.
      - run: cargo +1.90.0 build --all-features
      - run: cargo +1.90.0 --version

  ahead-of-stable:
    name: what the next toolchain would say
    # Only on the schedule and on demand. A new clippy lint is news, and news that fails
    # somebody's unrelated pull request is how a team learns to ignore a red tick.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Deliberately floating, and deliberately not on the request path. When this goes red,
      # raising the channel in `rust-toolchain.toml` is the work, and it is scheduled rather
      # than sprung on whoever pushed next.
      - name: Clippy on current stable
        run: |
          rustup run stable cargo clippy --all-features --all-targets -- -D warnings
          rustup run stable cargo clippy --no-default-features --all-targets -- -D warnings
