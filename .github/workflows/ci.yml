name: CI

on:
  push:
    branches: [main]
  pull_request:
  # For the job that looks ahead of the pinned toolchain. Monday morning, so a bump waiting
  # to be done is found on a weekday rather than in somebody's pull request.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain named here. `rust-toolchain.toml` is the one place that says which
      # compiler this crate is checked against, and rustup installs it on the first cargo
      # call. Naming a version here as well is how the two drift apart.
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      # Every feature combination, because a lint that only fires under one of them is a
      # lint that fires for the first person to enable it.
      - name: Clippy, default features
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, no features
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Clippy, all features
        run: cargo clippy --all-features --all-targets -- -D warnings

      # Docs are part of the deliverable. A broken intra doc link ships to docs.rs and
      # stays there until the next release.
      - name: Documentation, all features
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # And again with the default set, because a link to a feature gated item resolves
      # under `--all-features` and nowhere else. That is the only build where it is
      # invisible, and it is the build this job used to be.
      - name: Documentation, default features
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  features:
    name: each provider alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # A caller who wants only the local command line provider should not be building an
      # HTTP client and a TLS stack. These builds are the check that the features actually
      # separate, which a single all-features build cannot see.
      - run: cargo build --no-default-features
      - run: cargo build --no-default-features --features cli
      - run: cargo build --no-default-features --features anthropic
      - run: cargo build --no-default-features --features openai
      - run: cargo build --no-default-features --features testkit
      - run: cargo build --no-default-features --features retry
      - run: cargo build --no-default-features --features tracing

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stated in Cargo.toml. Untested, it is a claim rather than a promise.
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      # `+1.90.0` rather than a bare cargo, because `rust-toolchain.toml` outranks the
      # toolchain the step above installed. Without it this job would build with the pinned
      # compiler and report the minimum version as tested when nothing had tested it.
      - run: cargo +1.90.0 build --all-features
      - run: cargo +1.90.0 --version

  ahead-of-stable:
    name: what the next toolchain would say
    # Only on the schedule and on demand. A new clippy lint is news, and news that fails
    # somebody's unrelated pull request is how a team learns to ignore a red tick.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # Deliberately floating, and deliberately not on the request path. When this goes red,
      # raising the channel in `rust-toolchain.toml` is the work, and it is scheduled rather
      # than sprung on whoever pushed next.
      - name: Clippy on current stable
        run: |
          rustup run stable cargo clippy --all-features --all-targets -- -D warnings
          rustup run stable cargo clippy --no-default-features --all-targets -- -D warnings

  supply-chain:
    name: licences, advisories, duplicates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The advisory database moves on its own schedule, so a run that passed yesterday can
      # fail today with the same tree. That is the job working, not a flake.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `bans` is warn-only for duplicates, so a transitive crate somebody else has to
          # upgrade does not block a pull request here. Licences, advisories and sources do
          # block: each one is a decision rather than a wait.
          arguments: --all-features

  packaging:
    name: what would be published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A packaging problem found on a pull request rather than at the moment of release.
      # `exclude` in Cargo.toml drops /.github, /docs and the roadmap, and a dry run is what
      # proves that still does what it says.
      - name: Package
        run: cargo package --all-features --list

      - name: Publish, without publishing
        run: cargo publish --all-features --dry-run

  semver:
    name: nothing broke by accident
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # There has to be a published version to compare against. `cargo-semver-checks` does
      # not skip when there is not — it exits 101 with "llmr not found in registry", which
      # is what this job did the first time it ran.
      #
      # So the precondition is checked out loud rather than assumed. Asking the sparse index
      # is one request and no API token, and it fails the job only if the probe itself
      # breaks: `curl -f` distinguishes a 404 from a network error.
      - name: Is there a published version to compare against
        id: published
        run: |
          set -euo pipefail
          name=$(grep -m1 '^name' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          case ${#name} in
            1) path="1/$name" ;;
            2) path="2/$name" ;;
            3) path="3/${name:0:1}/$name" ;;
            *) path="${name:0:2}/${name:2:2}/$name" ;;
          esac
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://index.crates.io/$path")
          case "$code" in
            200) echo "exists=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the crates.io index answered $code, so this job cannot tell" \
                    "whether $name is published" >&2; exit 1 ;;
          esac

      - name: Nothing published yet
        if: steps.published.outputs.exists == 'false'
        run: |
          echo "::notice::Not on crates.io yet, so there is no released API to break." \
               "This job starts checking at the first release after 0.1.0."

      # This crate is unusually exposed to an accidental break: everything public is
      # #[non_exhaustive], so fields can be added without a major version — which is exactly
      # the arrangement where somebody assumes every change is additive. Adding a required
      # method to `Provider` is breaking. Narrowing a return type is breaking. Neither looks
      # like it in a diff.
      - name: cargo-semver-checks
        if: steps.published.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          feature-group: all-features

