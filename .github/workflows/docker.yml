name: Docker image

# The gateway image, on GitHub's registry. Built on every pull request so a broken
# Dockerfile is found before merge, and pushed only from main and from version tags.
#
#   ghcr.io/<owner>/llmr:latest   main
#   ghcr.io/<owner>/llmr:0.3.0    tag v0.3.0 (and :0.3)
#   ghcr.io/<owner>/llmr:sha-...  every push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 as well, for Apple silicon laptops and Graviton hosts. Emulated, so the arm64
      # half is the slow one; a pull request builds amd64 only to keep the check quick.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/llmr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to start and answer, not just build: refuse to start without a master
      # key, and with one, open a fresh database on its volume and answer its healthcheck.
      - name: The image runs
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t llmr:ci --cache-from type=gha .
          docker run --rm llmr:ci --version
          if docker run --rm llmr:ci 2> err.txt; then
            echo "::error::started without a master key"; exit 1
          fi
          grep -q "LLMR_MASTER_KEY" err.txt
          key=$(docker run --rm llmr:ci keygen)
          docker run -d --name llmr-ci -v llmr-ci-data:/var/lib/llmr -e LLMR_MASTER_KEY="$key" llmr:ci
          for i in $(seq 1 20); do
            docker exec llmr-ci /usr/local/bin/llmr healthcheck && break
            sleep 1
          done
          docker exec llmr-ci /usr/local/bin/llmr healthcheck
          # The command line tools are in the image and start.
          docker exec llmr-ci /opt/llmr/cli/claude-code/bin/claude --version
          docker exec llmr-ci /opt/llmr/cli/codex/bin/codex --version
          docker exec -e HOME=/tmp llmr-ci /opt/llmr/cli/gemini-cli/bin/gemini --version
          # A process of llmr's user, which is what a tool is, cannot read the master key out
          # of llmr. (Only llmr's processes are read: `docker exec` itself is given the
          # container's environment.)
          if docker exec llmr-ci sh -c 'for p in /proc/[0-9]*; do [ "$(cat $p/comm 2>/dev/null)" = llmr ] && cat $p/environ; done' 2>/dev/null | tr '\0' '\n' | grep -q LLMR_MASTER_KEY; then
            echo "::error::the master key is readable from /proc"; exit 1
          fi
          docker logs llmr-ci
