name: Docker image

# The gateway image, on GitHub's registry. Built on every pull request so a broken
# Dockerfile is found before merge, and pushed only from main and from version tags.
#
#   ghcr.io/<owner>/llmr:latest   main
#   ghcr.io/<owner>/llmr:0.3.0    tag v0.3.0 (and :0.3)
#   ghcr.io/<owner>/llmr:sha-...  every push

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 as well, for Apple silicon laptops and Graviton hosts. Emulated, so the arm64
      # half is the slow one; a pull request builds amd64 only to keep the check quick.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/llmr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image has to start and answer, not just build. The example configuration needs
      # vendor keys it will never be given here, so this proves the binary runs and refuses
      # a missing key loudly, which is the behaviour a deploy depends on.
      - name: The image runs
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load --platform linux/amd64 -t llmr:ci --cache-from type=gha .
          docker run --rm llmr:ci --version
          if docker run --rm llmr:ci 2> err.txt; then
            echo "::error::started without provider keys"; exit 1
          fi
          grep -q "ANTHROPIC_API_KEY" err.txt
