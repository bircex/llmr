# A release, from a tag rather than from somebody's laptop.
#
# llmr ships as a Docker image and as binaries, never as a crate. Pushing `v0.3.0` does
# three things:
#
#   * docker.yml publishes ghcr.io/<owner>/llmr:0.3.0 and :0.3 (amd64 and arm64)
#   * this workflow checks the tag, builds a binary per platform, and
#   * creates the GitHub Release with those binaries and the changelog section as notes.
#
# The tag is the trigger and the tag is also the claim: it must match the version in
# Cargo.toml and have a CHANGELOG.md section, and this refuses if it does not.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    name: everything CI checks, again, on the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No toolchain named here: `rust-toolchain.toml` is the one place that says which
      # compiler this is built with, exactly as in ci.yml.
      - uses: Swatinem/rust-cache@v2

      # The same eight ROADMAP.md lists. Repeated here rather than reused from ci.yml
      # because a release must not depend on a run that happened against a different commit.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --all-features
      - run: cargo test

  agree:
    name: the tag, the manifest and the changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the version in Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml $manifest" >&2
            exit 1
          fi

      - name: The changelog has a section for it
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[\?$tag\]\?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $tag. A release with nothing" >&2
            echo "::error::written down is one nobody can find out what changed in." >&2
            exit 1
          fi

  binaries:
    name: binary for ${{ matrix.target }}
    needs: [verify, agree]
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners rather than cross compilation, so each binary is built and run
          # on the platform it is for.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --features server --bin llmr

      # The binary has to run, not just link.
      - name: It runs
        run: ./target/release/llmr --version

      - name: Package
        run: |
          name="llmr-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/llmr LICENSE README.md llmr.example.toml "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: llmr-*.tar.gz*
          if-no-files-found: error

  release:
    name: publish the GitHub release
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The notes are the changelog section for this version, so what the release page says
      # and what CHANGELOG.md says cannot drift apart.
      - name: Notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1 || index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Docker: \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/llmr:${tag}\`"
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
