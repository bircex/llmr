[package]
name          = "llmr"
version       = "0.2.0"
edition       = "2021"
rust-version  = "1.90"
license       = "MIT"
description   = "An LLM router you run as a container: one OpenAI-compatible endpoint in front of Anthropic, OpenAI, Gemini and anything OpenAI-compatible."
repository    = "https://github.com/bircex/llmr"
# Distributed as a Docker image and release binaries, not as a crate. The engine under
# `src/` is how the gateway is built, not an API anybody downstream depends on, so nothing
# here can be published by accident.
publish       = false

[features]
# Both protocols, and no HTTP client. You supply a transport, which almost every program
# already has: adding this crate should not add 200 more.
default = ["anthropic", "openai"]

# Protocol translations. These are pure functions over JSON. The one thing they cannot do
# with nothing is put image bytes on a wire, so they pull `base64` — one crate, no
# dependencies of its own, and the alternative is this crate hand rolling an encoder whose
# bugs would corrupt an image rather than fail.
anthropic = ["dep:base64"]
openai    = ["dep:base64"]
gemini    = ["dep:base64"]

# Anthropic's models through Amazon. Depends on `anthropic` because it reuses that
# translation rather than copying it: Claude through Bedrock and Claude direct must send the
# same JSON, and two copies would disagree the first time one was fixed.
bedrock   = ["anthropic"]

# A command line tool as a subprocess. No network code at all.
cli = ["dep:tokio", "tokio/process", "tokio/io-util", "tokio/time"]

# The bundled `reqwest` transport, and the `from_env` constructors that need one. Opt in
# when you would rather not wire your own client.
reqwest = ["dep:reqwest"]

# Text as vectors. Its own trait rather than a method on `Provider`, and in this crate
# rather than a second one: what a caller *relies on* is shared even though what they touch
# is not. `docs/DESIGN.md` records the argument and what a separate crate would have cost.
embeddings = []

# The contract suite, for anyone writing a provider of their own.
testkit = []

# A retry policy the router applies, and a `tokio` timer to wait through. The `Retry` and
# `Delay` types are always present; this is only what waits, because waiting is the part
# that needs a runtime and this crate does not pick yours.
retry = ["dep:tokio", "tokio/time"]

# `tracing` spans on every call. Off by default: a library that emits whether you asked or
# not is a library people work around, and with this off the crate adds no dependency and
# does no work.
tracing = ["dep:tracing"]

# The router as a service: an HTTP server speaking the OpenAI chat completions shape, so any
# project reaches every configured provider through one base URL and one key. This is what
# the Docker image runs. It pulls a web server, a runtime and a log formatter, which is why
# it is a feature rather than something every build pays for.
server = [
    "anthropic",
    "openai",
    "gemini",
    "reqwest",
    "retry",
    "tracing",
    "dep:axum",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/net",
    "tokio/signal",
    "tokio/sync",
    "tokio/io-util",
]

[dependencies]
async-trait = "0.1"
base64      = { version = "0.22", optional = true, default-features = false, features = ["alloc"] }
# The `Stream` trait and nothing else. There is no `Stream` in std yet, and `stream` on
# `Provider` has to name one. `futures-core` is a single crate with no dependencies of its
# own; `futures` proper would pull the combinator stack this crate has no use for.
futures-core = "0.3"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
toml        = "1.1"
reqwest     = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio       = { version = "1", optional = true, default-features = false }
tracing     = { version = "0.1", optional = true, default-features = false, features = ["std"] }
axum        = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "fmt", "ansi", "env-filter", "json"] }

[dev-dependencies]
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
async-trait = "0.1"
tower       = { version = "0.5", default-features = false, features = ["util"] }

# The gateway. `cargo run --features server -- --config llmr.toml`, or the Docker image.
[[bin]]
name              = "llmr"
path              = "src/bin/llmr/main.rs"
required-features = ["server"]

# An example that needs a provider is not built when that provider is off. Cargo's own
# mechanism rather than a cfg attribute inside the file, so `cargo run --example` also
# reports the missing feature instead of building an empty binary.
# Every example reaches something, so each needs the bundled client as well as a protocol.
[[example]]
name              = "ask"
required-features = ["anthropic", "reqwest"]

[[example]]
name              = "what_it_cost"
required-features = ["anthropic", "reqwest"]

[[example]]
name              = "anything_openai_shaped"
required-features = ["openai", "reqwest"]

[[example]]
name              = "routing"
required-features = ["openai", "reqwest"]

[[example]]
name              = "is_it_reachable"
required-features = ["openai", "reqwest"]

[[example]]
name              = "nearest"
required-features = ["openai", "embeddings", "reqwest"]

# Only the lints that should hold in tests as well as in the library live here.
# The rest are inner attributes in lib.rs, so a test may still call `expect`.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The two that catch a deadlock before it can happen. A lock held across an await
# point is how an async program stops for good, and it is not obvious in review.
await_holding_lock        = "deny"
await_holding_refcell_ref = "deny"
