# llmr gateway configuration.
#
# Copy this to llmr.toml, keep what you use, and mount it at /etc/llmr/llmr.toml.
# Keys are never written here: each provider names the environment variable that holds its
# key, and the gateway refuses to start when one is missing.
#
# Check a file without serving anything:
#   docker run --rm -v ./llmr.toml:/etc/llmr/llmr.toml:ro --env-file .env llmr check

[server]
listen = "0.0.0.0:8080"
# Clients present one of these as `Authorization: Bearer <key>`. Comma separated, so a key
# can be rotated by adding the new one, moving clients, then removing the old one.
api_keys_env = "LLMR_API_KEYS"
# auth = "none"        # only for a network nobody else is on
# max_body_mb = 32     # images arrive inline, base64
# allow_direct = true  # let a client ask for "provider/model" as well as the names below
# preflight = true     # ask every route at startup whether it is reachable (free)

# ---------------------------------------------------------------------------------------
# Providers: where a prompt can go and whose key pays.
#
# kind = anthropic | openai | gemini | openai-compatible
# The vendor kinds read ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY unless
# api_key_env says otherwise, and ship a table of the models this release knows.

[[provider]]
id   = "anthropic"
kind = "anthropic"

[[provider]]
id   = "openai"
kind = "openai"

# [[provider]]
# id   = "gemini"
# kind = "gemini"

# Anything speaking /v1/chat/completions. The reach is required, because the same protocol
# is spoken by a model on your own hardware and by a hosted API, and which one this is
# decides where prompts may go. List the models it serves and what each can do: a route to
# a model not listed is reported unusable at startup.
#
# [[provider]]
# id       = "local"
# kind     = "openai-compatible"
# base_url = "http://ollama:11434/v1"
# reach    = "self-hosted"          # first-party-api | cloud-partner | private-endpoint | self-hosted
#
# [[provider.model]]
# id             = "llama3.1:8b"
# context_window = 128000
# max_output     = 8192
# tools          = true
# streaming      = true

# ---------------------------------------------------------------------------------------
# Models: the names clients ask for. A client sends `"model": "default"` and never learns
# which vendor answered, apart from the x-llmr-route response header.
#
# routes         "provider/model", tried in order until one answers
# order          as-listed | cheapest | healthiest
# on_device      only self-hosted routes may serve this name; never relaxed by a fallback
# retry_attempts attempts per route for a failure worth repeating (1 = no retry)
# breaker        skip a route that keeps failing for a while, instead of waiting on it
# deadline_secs  give up on the whole request after this long

[[model]]
name   = "default"
routes = ["anthropic/claude-sonnet-5", "openai/gpt-5.1"]

[[model]]
name   = "fast"
routes = ["anthropic/claude-haiku-4-5", "openai/gpt-5-mini"]
order  = "cheapest"

# [[model]]
# name      = "private"
# routes    = ["local/llama3.1:8b"]
# on_device = true
