# The Anthropic models this release knows about.
#
# A starting point, not a source of truth. Vendors add and retire models on their own
# schedule, so every row carries where the facts came from and when a person last checked
# them. A row with no provenance is a claim, and the first time one of them is wrong there
# is no way to tell which of the others still hold.
#
# Supply your own Registry when you need one that is current. `Registry::stale` and
# `Registry::unlisted` compare this table against what a provider says it serves.

provider = "anthropic"
reach    = "FirstPartyApi"

