# What Anthropic charges, as dated data.
#
# Prices change on the vendor's schedule and some carry conditions a flat number cannot
# express: introductory rates that expire, bands that step up past a context threshold,
# partner pricing that differs from the vendor's own. This file is a planning table. Where a
# provider reports cost directly on the response, that wins outright.
#
# Written as decimal text rather than numbers. Money is integer arithmetic all the way down,
# and 0.1 is not a value a binary float holds exactly.
#
# There is deliberately no table for the local command line reach. A subscription tool
# reports no usage, and a price applied to an invented token count produces a number that
# looks like a receipt. An unpriced call stays unpriced, and a report says so.

id             = "anthropic-2026-09"
provider       = "anthropic"
effective_from = "2026-08-01"
source         = "vendor pricing page"
verified_at    = "2026-09-27"
currency       = "USD"

# Per million tokens.
[[price]]
model       = "claude-opus-5"
input       = "5.00"
output      = "25.00"
cache_read  = "0.50"
cache_write = "6.25"

[[price]]
